<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b3fa8" />
  <title>Unismuh Twibbon — Universitas Muhammadiyah Makassar</title>
  <meta name="description" content="Bikin twibbon Universitas Muhammadiyah Makassar langsung dari HP — gratis, tanpa aplikasi. Unggah foto, sesuaikan, lalu unduh." />

  <!-- Open Graph (WhatsApp, Facebook, dll) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Unismuh Twibbon" />
  <meta property="og:title" content="Unismuh Twibbon — Universitas Muhammadiyah Makassar" />
  <meta property="og:description" content="Bikin & unduh twibbonmu — gratis, langsung di HP. Unggah foto, sesuaikan, lalu unduh." />
  <meta property="og:url" content="https://unismuh.online/" />
  <meta property="og:image" content="https://unismuh.online/og-image.jpg" />
  <meta property="og:image:secure_url" content="https://unismuh.online/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Unismuh Twibbon — Universitas Muhammadiyah Makassar" />
  <meta property="og:locale" content="id_ID" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Unismuh Twibbon — Universitas Muhammadiyah Makassar" />
  <meta name="twitter:description" content="Bikin & unduh twibbonmu — gratis, langsung di HP." />
  <meta name="twitter:image" content="https://unismuh.online/og-image.jpg" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo-img" src="logo-unismuh.png" alt="Logo Universitas Muhammadiyah Makassar" />
      <div>
        <h1>Unismuh Twibbon</h1>
        <p>Universitas Muhammadiyah Makassar</p>
      </div>
    </div>
    <a class="admin-link" href="admin.html">⚙ Admin</a>
  </header>

  <main class="layout">
    <!-- Kanvas preview -->
    <section class="stage">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas" width="1080" height="1080"></canvas>
        <div class="empty-hint" id="emptyHint">
          <span>🖼️</span>
          <p>Unggah fotomu untuk mulai</p>
        </div>
      </div>
      <p class="stage-tip">Seret foto untuk menggeser • cubit / scroll untuk zoom</p>
    </section>

    <!-- Panel kontrol -->
    <aside class="panel">
      <div class="card">
        <label class="section-title">1. Pilih Frame</label>
        <div class="frames" id="frameList"></div>
      </div>

      <div class="card">
        <label class="section-title">2. Unggah Foto</label>
        <label class="upload-btn" for="photoInput">
          <span>📷</span> Pilih foto
        </label>
        <input type="file" id="photoInput" accept="image/*" hidden />
      </div>

      <div class="card" id="adjustCard" hidden>
        <label class="section-title">3. Atur Foto</label>

        <div class="control">
          <div class="control-head"><span>Zoom</span><output id="zoomVal">100%</output></div>
          <input type="range" id="zoom" min="0.3" max="4" step="0.01" value="1" />
        </div>

        <div class="control">
          <div class="control-head"><span>Putar</span><output id="rotVal">0°</output></div>
          <input type="range" id="rotate" min="-180" max="180" step="1" value="0" />
        </div>

        <div class="btn-row">
          <button class="btn ghost" id="flipBtn">↔ Balik</button>
          <button class="btn ghost" id="resetBtn">⟲ Reset</button>
        </div>
      </div>

      <div class="card">
        <label class="section-title">4. Unduh</label>
        <button class="btn primary" id="downloadBtn" disabled>⬇ Unduh Twibbon (PNG)</button>
        <p class="note">File langsung tersimpan di perangkatmu. Tidak ada yang diunggah ke server.</p>
      </div>
    </aside>
  </main>

  <footer class="site-footer">
    <p class="footer-cap">Peringkat &amp; Akreditasi</p>
    <div class="ranking-strip">
      <img src="ranking-strip.png" alt="Logo peringkat dan akreditasi Universitas Muhammadiyah Makassar" />
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
